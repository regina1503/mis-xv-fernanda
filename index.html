<!DOCTYPE html>
<html lang="es" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Fernanda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow: hidden;
        }

        .font-serif-title { font-family: 'Cinzel', serif; }
        .font-script { font-family: 'Great Vibes', cursive; }

        /* Contenedor con scroll; cada página se muestra completa */
        .snap-container {
            scroll-snap-type: y proximity;
            overflow-y: scroll;
            height: 100vh;
            scroll-behavior: smooth;
        }

        .page {
            scroll-snap-align: start;
        }

        /* ===== Reproductor sin fondo (blanco) ===== */
        .music-white { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45)); }
        .player-seek {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: #fff;
            outline: none;
            cursor: pointer;
        }

        .player-seek::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: none;
        }

        .player-seek::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: none;
        }

        .player-seek::-moz-range-track {
            height: 4px;
            background: #fff;
            border-radius: 999px;
        }

        .ctrl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn.is-off { opacity: 0.45; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        ::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.6); border-radius: 4px; }
    </style>
</head>
<body class="h-full w-full select-none bg-black text-white">

    <!-- Scrollable Container -->
    <main id="scroll-container" class="snap-container">

        <!-- PÁGINA 1 -->
        <section id="section-0" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto.jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto.jpg" alt="Página 1" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />

                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 text-center text-amber-200/90 text-[11px] animate-bounce pointer-events-none bg-black/60 px-3 py-1.5 rounded-full border border-amber-300/30 backdrop-blur-md shadow-lg whitespace-nowrap">
                    <i class="fa-solid fa-chevron-down text-xs mb-0.5 block"></i>
                    Desliza hacia abajo
                </div>
            </div>
        </section>

        <!-- PÁGINA 2: REPRODUCTOR DE MÚSICA -->
        <section id="section-1" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(1).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(1).jpg" alt="Página 2" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />

                <!-- Reproductor de Música (sin fondo, 15% más pequeño) -->
                <div class="absolute z-30 bottom-[60%] left-1/2 -translate-x-1/2 scale-[0.85] origin-center w-[86%] max-w-[300px]">
                    <div class="music-white px-4 pt-3 pb-3.5 text-white">

                        <!-- Corazón -->
                        <div class="flex justify-end">
                            <button id="like-btn" onclick="toggleLike()" class="ctrl-btn text-lg" aria-label="Me gusta">
                                <i id="like-icon" class="fa-solid fa-heart"></i>
                            </button>
                        </div>

                        <!-- Barra de progreso -->
                        <div class="mt-2">
                            <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" class="player-seek" aria-label="Progreso de la canción">
                            <div class="flex justify-between mt-1.5 text-[11px] text-white font-medium">
                                <span id="current-time">0:00</span>
                                <span id="remaining-time">-0:00</span>
                            </div>
                        </div>

                        <!-- Controles -->
                        <div class="mt-2 flex items-center justify-between px-1">
                            <button id="shuffle-btn" onclick="toggleShuffle()" class="ctrl-btn is-off text-sm" aria-label="Aleatorio">
                                <i class="fa-solid fa-shuffle"></i>
                            </button>
                            <button onclick="prevTrack()" class="ctrl-btn text-xl" aria-label="Anterior">
                                <i class="fa-solid fa-backward-step"></i>
                            </button>
                            <button id="play-btn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center transition-transform active:scale-95" aria-label="Reproducir">
                                <i id="play-icon" class="fa-solid fa-play text-xl ml-1"></i>
                            </button>
                            <button onclick="nextTrack()" class="ctrl-btn text-xl" aria-label="Siguiente">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                            <button id="repeat-btn" onclick="toggleRepeat()" class="ctrl-btn text-sm" aria-label="Repetir">
                                <i class="fa-solid fa-repeat"></i>
                            </button>
                        </div>

                        <audio id="bg-audio" loop preload="metadata">
                            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-wedding-115309.mp3" type="audio/mpeg">
                        </audio>
                    </div>
                </div>
            </div>
        </section>

        <!-- PÁGINA 3 -->
        <section id="section-2" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(3).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(3).jpg" alt="Página 3" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />
            </div>
        </section>

        <!-- PÁGINA 4 -->
        <section id="section-3" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(2).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(2).jpg" alt="Página 4" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />
            </div>
        </section>

        <!-- PÁGINA 5 -->
        <section id="section-4" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(4).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(4).jpg" alt="Página 5" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />

                <!-- Botón de Ubicación en el Centro -->
                <a href="https://maps.google.com" target="_blank" class="absolute z-30 top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2 bg-black/60 hover:bg-black/80 text-white font-medium px-4 py-2 rounded-full border border-white/30 backdrop-blur-md shadow-xl text-xs flex items-center gap-2 whitespace-nowrap transition-transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    Ver Ubicación
                </a>

                <!-- Botón de Ubicación al Final -->
                <a href="https://maps.google.com" target="_blank" class="absolute z-30 bottom-8 left-1/2 -translate-x-1/2 bg-black/60 hover:bg-black/80 text-white font-medium px-4 py-2 rounded-full border border-white/30 backdrop-blur-md shadow-xl text-xs flex items-center gap-2 whitespace-nowrap transition-transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-location-dot text-red-500"></i>
                    Ver Ubicación
                </a>
            </div>
        </section>

        <!-- PÁGINA 6 -->
        <section id="section-5" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(5).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(5).jpg" alt="Página 6" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />
            </div>
        </section>

        <!-- PÁGINA 7 -->
        <section id="section-6" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(6).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(6).jpg" alt="Página 7" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />
            </div>
        </section>

        <!-- PÁGINA 8 -->
        <section id="section-7" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(7).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(7).jpg" alt="Página 8" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />
            </div>
        </section>

        <!-- PÁGINA 9 -->
        <section id="section-8" class="page relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-black">
            <div class="absolute inset-0 bg-cover bg-center blur-3xl opacity-35 scale-110" style="background-image: url('https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(8).jpg');"></div>
            <div class="relative z-10 w-full max-w-[520px] mx-auto">
                <img src="https://raw.githubusercontent.com/regina1503/mis-xv-fernanda/main/Agregar%20algo%20de%20texto%20(8).jpg" alt="Página 9" class="block w-full h-auto pointer-events-none drop-shadow-2xl" />

                <!-- Cuenta Regresiva al 24 de Octubre a las 5:00 PM -->
                <div class="absolute z-30 bottom-[calc(40%_+_3rem)] left-1/2 -translate-x-1/2 text-white text-center">
                    <div id="countdown" class="flex gap-3 text-white font-mono">
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="w-14 h-14 rounded-full border-2 border-white flex items-center justify-center bg-black/25 backdrop-blur-sm shadow-lg">
                                <span id="cd-days" class="text-xl font-bold">00</span>
                            </div>
                            <span class="text-[9px] uppercase tracking-wider text-white drop-shadow">Días</span>
                        </div>
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="w-14 h-14 rounded-full border-2 border-white flex items-center justify-center bg-black/25 backdrop-blur-sm shadow-lg">
                                <span id="cd-hours" class="text-xl font-bold">00</span>
                            </div>
                            <span class="text-[9px] uppercase tracking-wider text-white drop-shadow">Horas</span>
                        </div>
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="w-14 h-14 rounded-full border-2 border-white flex items-center justify-center bg-black/25 backdrop-blur-sm shadow-lg">
                                <span id="cd-mins" class="text-xl font-bold">00</span>
                            </div>
                            <span class="text-[9px] uppercase tracking-wider text-white drop-shadow">Min</span>
                        </div>
                        <div class="flex flex-col items-center gap-1.5">
                            <div class="w-14 h-14 rounded-full border-2 border-white flex items-center justify-center bg-black/25 backdrop-blur-sm shadow-lg">
                                <span id="cd-secs" class="text-xl font-bold">00</span>
                            </div>
                            <span class="text-[9px] uppercase tracking-wider text-white drop-shadow">Seg</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // ===== Reproductor de música =====
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const remainingTimeEl = document.getElementById('remaining-time');
        const likeIcon = document.getElementById('like-icon');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        function setPlayingUI(isPlaying) {
            if (isPlaying) {
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                playBtn.setAttribute('aria-label', 'Pausar');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                playBtn.setAttribute('aria-label', 'Reproducir');
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        audio.addEventListener('play', () => setPlayingUI(true));
        audio.addEventListener('pause', () => setPlayingUI(false));

        // Anterior: vuelve al inicio de la canción
        function prevTrack() {
            audio.currentTime = 0;
        }

        // Siguiente: como solo hay una canción, la reinicia y la reproduce
        function nextTrack() {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function toggleLike() {
            likeIcon.classList.toggle('text-red-500');
        }

        function toggleShuffle() {
            shuffleBtn.classList.toggle('is-off');
        }

        function toggleRepeat() {
            audio.loop = !audio.loop;
            repeatBtn.classList.toggle('is-off', !audio.loop);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressUI() {
            const duration = audio.duration || 0;
            const current = audio.currentTime || 0;
            const progress = duration ? (current / duration) * 100 : 0;
            seekBar.value = progress;
            currentTimeEl.textContent = formatTime(current);
            remainingTimeEl.textContent = '-' + formatTime(Math.max(0, duration - current));
        }

        audio.addEventListener('loadedmetadata', updateProgressUI);
        audio.addEventListener('timeupdate', updateProgressUI);

        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
                updateProgressUI();
            }
        });

        // ===== Cuenta regresiva al 24 de Octubre a las 5:00 PM =====
        const targetDate = new Date('October 24, 2026 17:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('cd-days').textContent = days < 10 ? '0' + days : days;
                document.getElementById('cd-hours').textContent = hours < 10 ? '0' + hours : hours;
                document.getElementById('cd-mins').textContent = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('cd-secs').textContent = seconds < 10 ? '0' + seconds : seconds;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
