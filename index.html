    <script>
        // ===== Reproductor de música =====
        const audio = document.getElementById('bg-audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const seekBar = document.getElementById('seek-bar');
        const currentTimeEl = document.getElementById('current-time');
        const remainingTimeEl = document.getElementById('remaining-time');
        const likeIcon = document.getElementById('like-icon');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        function setPlayingUI(isPlaying) {
            if (isPlaying) {
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                playBtn.setAttribute('aria-label', 'Pausar');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                playBtn.setAttribute('aria-label', 'Reproducir');
            }
        }

        function togglePlay() {
            if (audio.paused) {
                if (!startApplied && audio.duration) { startApplied = true; goToStart(); }
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        audio.addEventListener('play', () => setPlayingUI(true));
        audio.addEventListener('pause', () => setPlayingUI(false));

        // La canción empieza en el segundo 50
        const START_TIME = 50;
        let repeatOn = true;
        let startApplied = false;

        function goToStart() {
            if (audio.duration && audio.duration > START_TIME) {
                audio.currentTime = START_TIME;
            } else {
                audio.currentTime = 0;
            }
        }

        // Al cargar la canción, colocarla en el segundo 50
        audio.addEventListener('loadedmetadata', () => {
            if (!startApplied) {
                startApplied = true;
                goToStart();
            }
        });

        // Al terminar, si "repetir" está activo, vuelve a empezar en el segundo 50
        audio.addEventListener('ended', () => {
            if (repeatOn) {
                goToStart();
                audio.play().catch(() => {});
            }
        });

        // Anterior: vuelve al segundo 50
        function prevTrack() {
            goToStart();
        }

        // Siguiente: como solo hay una canción, vuelve al segundo 50 y la reproduce
        function nextTrack() {
            goToStart();
            audio.play().catch(() => {});
        }

        function toggleLike() {
            likeIcon.classList.toggle('text-red-500');
        }

        function toggleShuffle() {
            shuffleBtn.classList.toggle('is-off');
        }

        function toggleRepeat() {
            repeatOn = !repeatOn;
            repeatBtn.classList.toggle('is-off', !repeatOn);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateProgressUI() {
            const duration = audio.duration || 0;
            const current = audio.currentTime || 0;
            const progress = duration ? (current / duration) * 100 : 0;
            seekBar.value = progress;
            currentTimeEl.textContent = formatTime(current);
            remainingTimeEl.textContent = '-' + formatTime(Math.max(0, duration - current));
        }

        audio.addEventListener('loadedmetadata', updateProgressUI);
        audio.addEventListener('timeupdate', updateProgressUI);

        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
                updateProgressUI();
            }
        });

        // ===== Cuenta regresiva al 24 de Octubre a las 5:00 PM =====
        const targetDate = new Date('October 24, 2026 17:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('cd-days').textContent = days < 10 ? '0' + days : days;
                document.getElementById('cd-hours').textContent = hours < 10 ? '0' + hours : hours;
                document.getElementById('cd-mins').textContent = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('cd-secs').textContent = seconds < 10 ? '0' + seconds : seconds;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
